services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bold
      POSTGRES_PASSWORD: bold
      POSTGRES_DB: bold
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bold -d bold"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bold:bold@postgres:5432/bold
      JWT_SECRET: ${JWT_SECRET:-bold-dev-change-in-production}
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4321,http://127.0.0.1:4321,https://waitengchong.github.io}
    ports:
      - "3000:3000"
    command: sh -c "npm run db:setup && npm run start"